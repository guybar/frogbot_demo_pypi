name: build-python

on:
  [workflow_dispatch]

permissions:
  id-token: write
  contents: read

jobs:
  build-python:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4
      
      - name: Install jfrog cli
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ vars.ARTIFACTORY_URL }}
        with:
            oidc-provider-name: guy-github
            
      - name: Configure Pypi
        run: |
          jf pip-config --repo-resolve=pypi-dev
            
      - name: Scan Pypi code
        run: |
          # jf curation-audit
          jf audit

      - name: Build Pypi Package
        run: |
          jf pip install -r requirements.txt --module=pyyaml_demo
          python setup.py sdist bdist_wheel

      - name: Publish Pypi package
        run: |
          jf rt u dist/ pypi-dev/ --module=pyyaml_demo

          jf rt bag
          
          jf rt bce
          
          jf rt bp
